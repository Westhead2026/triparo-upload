name: Upload to App Store Connect

on:
  workflow_dispatch:

jobs:
  upload:
    runs-on: macos-latest
    steps:
      - name: Download the signed IPA
        run: curl -L -o app.ipa "https://github.com/Westhead2026/triparo-upload/releases/download/v1.0.0/ios-2.130297.1.ipa"

      - name: Install fastlane
        run: gem install fastlane

      - name: Create API key JSON
        run: |
          printf '{\n  "key_id": "%s",\n  "issuer_id": "%s",\n  "key": "%s",\n  "in_house": false\n}' \
            "${{ secrets.APPSTORE_KEY_ID }}" \
            "${{ secrets.APPSTORE_ISSUER_ID }}" \
            "${{ secrets.APPSTORE_API_KEY }}" > key.json
          cat key.json

      - name: Upload IPA to App Store Connect
        run: |
          fastlane pilot upload \
            --ipa app.ipa \
            --api_key_path key.json \
            --skip_waiting_for_build_processing
